{% extends "layout.html" %} {% block title %} Profile {% endblock %} {% block
content %}

<h2 class="mb-4">Profile</h2>

<div class="card p-4 mb-4">
  <div class="row">
    <div class="col-md-4 mb-3 mb-md-0">
      <div class="detail-label">Username</div>
      <div class="detail-value">{{ user.username }}</div>
    </div>

    <div class="col-md-4 mb-3 mb-md-0">
      <div class="detail-label">Email</div>
      <div class="detail-value">{{ user.email }}</div>
    </div>

    <div class="col-md-4">
      <div class="detail-label">Joined</div>
      <div class="detail-value">{{ user.created_at }}</div>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-md-6 mb-3 mb-md-0">
    <div class="card p-4 text-center">
      <div class="detail-label mb-2">Total Searches</div>
      <div style="font-size: 2rem; font-weight: 700">{{ total_searches }}</div>
    </div>
  </div>

  <div class="col-md-6">
    <div class="card p-4 text-center">
      <div class="detail-label mb-2">Favourite Wallets</div>
      <div style="font-size: 2rem; font-weight: 700">
        {{ total_favourites }}
      </div>
    </div>
  </div>
</div>

{% endblock %}
