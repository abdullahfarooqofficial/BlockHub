{% extends "layout.html" %} {% block title %} Register {% endblock %} {% block
content %}

<div class="container" style="max-width: 500px">
  <h2 class="mb-4">Create Account</h2>

  <form action="/register" method="post">
    <div class="mb-3">
      <input
        class="form-control"
        name="username"
        placeholder="Username"
        required
      />
    </div>

    <div class="mb-3">
      <input
        class="form-control"
        type="email"
        name="email"
        placeholder="Email"
        required
      />
    </div>

    <div class="mb-3">
      <input
        class="form-control"
        type="password"
        name="password"
        placeholder="Password"
        required
      />
    </div>

    <div class="mb-3">
      <input
        class="form-control"
        type="password"
        name="confirmation"
        placeholder="Confirm Password"
        required
      />
    </div>

    <button class="btn btn-primary w-100">Register</button>
  </form>
</div>

{% endblock %}
