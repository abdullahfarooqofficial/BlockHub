{% extends "layout.html" %} {% block title %}Dashboard{% endblock %} {% block
content %}

<div class="container">
  <h2 class="mb-4">Dashboard</h2>

  <div class="card p-4">
    <h4 class="mb-3">Search Wallet</h4>

    <form action="/wallet" method="GET">
      <div class="mb-3">
        <input
          class="form-control"
          type="text"
          name="address"
          placeholder="Enter wallet address"
          required
        />
      </div>

      <div class="mb-3">
        <select class="form-select" name="network" required>
          <option value="">Select Network</option>
          <option value="ethereum">Ethereum</option>
          <option value="bsc">BNB Smart Chain</option>
          <option value="polygon">Polygon</option>
        </select>
      </div>

      <button class="btn btn-dark">Search Wallet</button>
    </form>
  </div>
</div>

{% endblock %}
